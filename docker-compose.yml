services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  simulator:
    build: .
    container_name: simulator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    command: python -m src.sensor_simulator 
    restart: unless-stopped

  validator:
    build: .
    container_name: validator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: WARNING
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    command: python -m src.validator  
    restart: unless-stopped

  observer:
    build: .
    container_name: observer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: WARNING
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    command: python -m src.observer  
    restart: unless-stopped

  preprocessor:
    build: .
    container_name: preprocessor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    command: python -m src.preprocessor 
    restart: unless-stopped

  model: 
    build: .
    container_name: model
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    command: python -m src.downstream_model
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
